<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A94A6"/>
    </marker>
  </defs>
  <rect width="1200" height="360" rx="14" fill="#FFFFFF"/>

  <!-- stage labels -->
  <g font-size="11" fill="#8A94A6" letter-spacing="1.2" font-weight="600">
    <text x="130" y="38" text-anchor="middle">INPUT</text>
    <text x="355" y="38" text-anchor="middle">FEATURES</text>
    <text x="590" y="38" text-anchor="middle">BASE MODELS</text>
    <text x="830" y="38" text-anchor="middle">STACKING</text>
    <text x="1060" y="38" text-anchor="middle">OUTPUT</text>
  </g>

  <!-- input -->
  <rect x="40" y="148" width="180" height="104" rx="10" fill="#F3F6FA" stroke="#C9D3E1"/>
  <text x="130" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2A3C">DNA methylation</text>
  <text x="130" y="207" text-anchor="middle" font-size="13" fill="#4A5568">Illumina 450K, blood</text>
  <text x="130" y="227" text-anchor="middle" font-size="13" fill="#4A5568">FHS, n = 3,499</text>

  <!-- features -->
  <rect x="265" y="148" width="180" height="104" rx="10" fill="#F3F6FA" stroke="#C9D3E1"/>
  <text x="355" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2A3C">Elastic-net Cox</text>
  <text x="355" y="207" text-anchor="middle" font-size="13" fill="#4A5568">feature selection</text>
  <text x="355" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#2F5D8A">190 CpGs</text>

  <!-- base models -->
  <g font-size="13.5" fill="#1F2A3C">
    <rect x="490" y="62"  width="200" height="44" rx="8" fill="#EEF3F9" stroke="#B9C7DA"/>
    <text x="590" y="89" text-anchor="middle">Random survival forest</text>
    <rect x="490" y="118" width="200" height="44" rx="8" fill="#EEF3F9" stroke="#B9C7DA"/>
    <text x="590" y="145" text-anchor="middle">Gradient boosting survival</text>
    <rect x="490" y="174" width="200" height="44" rx="8" fill="#EEF3F9" stroke="#B9C7DA"/>
    <text x="590" y="201" text-anchor="middle">Kernel survival SVM</text>
    <rect x="490" y="230" width="200" height="44" rx="8" fill="#EEF3F9" stroke="#B9C7DA"/>
    <text x="590" y="257" text-anchor="middle">Weibull AFT</text>
    <rect x="490" y="286" width="200" height="44" rx="8" fill="#EEF3F9" stroke="#B9C7DA"/>
    <text x="590" y="313" text-anchor="middle">MTLR</text>
  </g>

  <!-- meta-learner -->
  <rect x="735" y="140" width="190" height="120" rx="10" fill="#2F5D8A"/>
  <text x="830" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Neural network</text>
  <text x="830" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">meta-learner</text>
  <text x="830" y="228" text-anchor="middle" font-size="13" fill="#D6E2F0">Cox partial likelihood</text>

  <!-- outputs -->
  <rect x="970" y="104" width="180" height="88" rx="10" fill="#F3F6FA" stroke="#C9D3E1"/>
  <text x="1060" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2A3C">Ensemble risk score</text>
  <text x="1060" y="163" text-anchor="middle" font-size="13" fill="#4A5568">rescaled to years of age</text>
  <rect x="970" y="226" width="180" height="88" rx="10" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1060" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2A3C">External validation</text>
  <text x="1060" y="285" text-anchor="middle" font-size="13" fill="#4A5568">WHI, n = 1,862</text>

  <!-- arrows -->
  <g stroke="#8A94A6" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="220" y1="200" x2="262" y2="200"/>
    <path d="M445,200 C468,200 468,84 487,84"/>
    <path d="M445,200 C468,200 468,140 487,140"/>
    <line x1="445" y1="200" x2="487" y2="196"/>
    <path d="M445,200 C468,200 468,252 487,252"/>
    <path d="M445,200 C468,200 468,308 487,308"/>
    <path d="M690,84  C714,84  712,200 732,200"/>
    <path d="M690,140 C714,140 712,200 732,200"/>
    <line x1="690" y1="196" x2="732" y2="200"/>
    <path d="M690,252 C714,252 712,200 732,200"/>
    <path d="M690,308 C714,308 712,200 732,200"/>
    <path d="M925,200 C948,200 948,148 967,148"/>
    <line x1="1060" y1="192" x2="1060" y2="223"/>
  </g>
</svg>

